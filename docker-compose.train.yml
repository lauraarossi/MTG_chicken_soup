services:
  trainer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mtg_user:${POSTGRES_PASSWORD:-mtgpassword}@db:5432/mtg_chicken_soup
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install torch>=2.12.0 transformers>=5.9.0 peft>=0.14.0 trl>=0.9.0
             bitsandbytes>=0.43.0 accelerate>=1.0.0 scipy sentencepiece pyyaml &&
             python -m app.ml.training.finetune configs/training_config.yaml"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mtg_chicken_soup
      POSTGRES_USER: mtg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtgpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg_user -d mtg_chicken_soup"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
