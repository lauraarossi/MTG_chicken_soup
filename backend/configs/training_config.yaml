# Base model — no special license required, excellent quality
model_name: "Qwen/Qwen2.5-7B-Instruct"
# Swap for Llama if you have HuggingFace access:
# model_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"

# LoRA
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training — tuned for RTX 5070 Ti (16GB VRAM)
output_dir: "models/mtg-qlora"
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4   # effective batch = 16
learning_rate: 2.0e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
max_seq_length: 2048
fp16: false
bf16: true                        # RTX 5070 Ti fully supports bfloat16
logging_steps: 10
save_steps: 100
eval_steps: 100
save_total_limit: 3
dataloader_num_workers: 4

# Dataset
dataset_path: "data/processed/training_dataset.jsonl"
validation_split: 0.1

# 4-bit quantization (fits 7B model in 16GB VRAM)
use_4bit: true
bnb_4bit_quant_type: "nf4"
bnb_4bit_compute_dtype: "bfloat16"
use_nested_quant: true
