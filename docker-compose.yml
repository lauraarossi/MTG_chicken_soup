services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mtg_chicken_soup
      POSTGRES_USER: mtg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtgpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg_user -d mtg_chicken_soup"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mtg_user:${POSTGRES_PASSWORD:-mtgpassword}@db:5432/mtg_chicken_soup
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/.next
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

  # Local LLM for development — avoids Claude API costs while iterating.
  # Requires the NVIDIA Container Toolkit for GPU passthrough.
  # Start with: docker compose --profile local-llm up
  # Then pull models: docker compose exec ollama ollama pull llama3.2
  #                   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  ollama_data:
